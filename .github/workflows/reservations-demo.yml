name: Deploy reservations demo

on:
  push:
    branches:
      - codex/reservation-pitch
    paths:
      - .github/workflows/reservations-demo.yml
      - pitch/**
  workflow_dispatch:

concurrency:
  group: reservations-demo-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    name: Build and deploy res.beareberly.com demo
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: pitch
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: pitch/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Deploy to Cloudflare Pages
        run: npm exec --yes wrangler@latest -- pages deploy dist --project-name res-beareberly --branch codex/reservation-pitch --commit-hash "$GITHUB_SHA"
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
